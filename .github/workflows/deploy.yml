name: Deploy to EC2

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_ACCOUNT_ID:role/trellis-github-actions-role
          aws-region: us-west-1

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ubuntu/trellis-money-aws-postgresql",
              "git pull origin master",
              "pnpm install",
              "source /home/ubuntu/load-env.sh",
              "NODE_OPTIONS=\"--max-old-space-size=1536\" pnpm run build",
              "source /home/ubuntu/load-env.sh && pm2 restart nextjs-app --update-env"
            ]' \
            --region us-west-1